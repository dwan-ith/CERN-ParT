name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run unit tests (offline)
        run: pytest -m "not network" -v --tb=short

      - name: Check that the URL manifest is present and non-empty
        run: |
          test -s data/all_urls.txt
          echo "URLs in manifest: $(grep -vc '^#' data/all_urls.txt)"

  network:
    name: Integration test (streams CERN open data)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The network tests stream real files from CERN Open Data; run them
    # manually or on a schedule so that a CERN outage does not block PRs.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run network tests
        run: pytest -m network -v --tb=short
