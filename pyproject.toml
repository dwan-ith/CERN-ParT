[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cern-ai"
version = "0.1.0"
description = "Particle Transformer (ParT) Foundation Model streaming CMS NanoAOD via HTTPS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Antigravity HEP Lab" }]
dependencies = [
    "torch>=2.0.0",
    "uproot>=5.0.0",
    "awkward>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
